用者在單次練習中持續輸出，並快速得到可執行的修正方向。\\n\\n\\n## 核心功能\\n\\n1. **情境任務引導**\\n   - 每個任務定義角色、對手方語句與情緒線索，降低開口門檻並增加真實對話感。\\n\\n2. **回合式語音互動**\\n   - 支援 `REC / NEXT / SKIP` 練習節奏，使用者能快速推進到下一輪而不中斷操作。\\n\\n3. **即時診斷回饋**\\n   - 針對發音（Pronunciation）與韻律（Prosody）輸出問題分類與修正方向，不只給分數，也提供具體建議。\\n\\n4. **可重播與修正循環**\\n   - 透過播放原句與修正後重錄的循環機制，建立「聽見問題 → 修正輸出 → 再驗證」的學習閉環。\\n\\n\\n## 技術實作重點\\n\\n- 後端語音流程整合 ASR、文本對齊與規則化評分，將診斷結果標準化為可視化項目。\\n\\n- 介面以手機優先（mobile-first）設計，確保短時間練習也能有完整互動體驗。\\n\\n- 任務腳本化結構支援快速新增場景，方便後續擴展到客服、醫療溝通與職場簡報等應用。\\n\\n\\n## 使用者價值\\n\\n- 對學習者：每一輪都有明確目標與立即回饋，降低「不知道怎麼改」的挫折。\\n\\n- 對訓練場景：可把主觀口說練習轉成可量化追蹤的任務流程，便於持續優化內容。\\n\\n\\n## 目前狀態\\n\\n- 已完成情境互動版與發音/韻律回饋版介面，持續擴增任務庫與評分精準度。\"}}]\n"])</script></body></html>
